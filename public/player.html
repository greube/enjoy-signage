<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENJOY Signage Player</title>
<link rel="icon" type="image/png" href="/static/brand/icon-32.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body.playing { cursor: none; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #stage.r90, #stage.r270 { inset: auto; top: 50%; left: 50%; width: 100vh; height: 100vw; }
  #stage.r90  { transform: translate(-50%, -50%) rotate(90deg); }
  #stage.r270 { transform: translate(-50%, -50%) rotate(270deg); }
  #stage.r180 { transform: rotate(180deg); }

  .layer { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; background: #000; }
  .layer.show { opacity: 1; }
  .layer.cut { transition: none; }
  .layer img, .layer video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .layer.cover img, .layer.cover video { object-fit: cover; }
  .layer iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }

  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background-size: cover; background-position: center; }
  .slide.has-img::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  .slide-inner { position: relative; max-width: 86%; text-align: center; }
  .slide.left .slide-inner { text-align: left; width: 86%; }
  .slide h1 { font-size: 8vmin; line-height: 1.08; margin: 0 0 .35em; font-weight: 750; letter-spacing: -.01em; }
  .slide p  { font-size: 4.2vmin; line-height: 1.4; margin: 0; white-space: pre-line; opacity: .92; }
  .slide .count { font-size: 22vmin; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.02em; }
  .slide .count.small { font-size: 9vmin; }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; z-index: 10; }
  #idle { color: rgba(255,255,255,.28); font-size: 2.4vmin; gap: .6em; }
  #idle img { max-width: 46vmin; max-height: 14vmin; object-fit: contain; opacity: .8; margin-bottom: 3vmin; }
  #picker .logo { max-height: 56px; max-width: 360px; object-fit: contain; display: block; margin-bottom: 30px; }
  #picker .brand { color: #8d99b0; font-size: 14px; letter-spacing: .04em; margin: 28px 0 0; }
  #picker .brand b { letter-spacing: .1em; }
  #idle b { font-size: 3.4vmin; color: rgba(255,255,255,.45); font-weight: 600; }
  #identify { background: rgba(20, 60, 160, .92); font-size: 12vmin; font-weight: 800; display: none; z-index: 20; }
  #identify small { font-size: 3vmin; font-weight: 500; opacity: .8; margin-top: 1em; }
  #status { position: fixed; right: 1.2vmin; bottom: 1.2vmin; width: 1.2vmin; height: 1.2vmin; border-radius: 50%;
    background: #e5484d; z-index: 30; display: none; box-shadow: 0 0 0 .3vmin rgba(0,0,0,.5); }

  #picker { position: fixed; inset: 0; background: #0e1420; display: none; overflow: auto; z-index: 40; cursor: auto; }
  #picker .wrap { max-width: 720px; margin: 8vh auto; padding: 0 24px; }
  #picker h1 { font-size: 30px; margin: 0 0 6px; }
  #picker p { color: #9aa6bd; margin: 0 0 28px; font-size: 17px; }
  #picker button { display: block; width: 100%; text-align: left; background: #1a2333; color: #fff; border: 2px solid #26324a;
    border-radius: 12px; padding: 18px 22px; font-size: 21px; margin-bottom: 12px; cursor: pointer; font-family: inherit; }
  #picker button:hover, #picker button:focus { border-color: #5b8cff; outline: none; background: #1f2b40; }
  #picker button span { display: block; font-size: 15px; color: #8d99b0; margin-top: 3px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="idle" class="overlay" style="display:none"><img id="idle-logo" alt="" hidden><b id="idle-name"></b><span id="idle-msg">Nothing scheduled</span></div>
<div id="identify" class="overlay"><div id="identify-name"></div><small>This screen is being identified from the admin panel</small></div>
<div id="status" title="Lost connection to the signage server — still playing the last content"></div>
<div id="picker"><div class="wrap"><img class="logo" id="picker-logo" alt="" hidden><h1>Which screen is this?</h1><p>Choose once — this device will remember it. To change later, open <b>/player?pick</b>.</p><div id="picker-list"></div></div></div>

<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const params = new URLSearchParams(location.search);
  const previewId = params.get('playlist');
  let screenId = decodeURIComponent(location.pathname.split('/')[2] || '');
  const KEY = 'signage.screenId';
  const store = {
    get: () => { try { return localStorage.getItem(KEY); } catch { return null; } },
    set: (v) => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} },
  };

  let state = null, hash = null, boot = null, idx = -1, timer = null, token = 0;
  let pollTimer = null, polling = false, pollSoon = false;
  let playedKey = ''; // a play-once playlist we've finished, until the server has moved this screen on
  let current = null, serverOffset = 0, lastError = '', countdownTimers = [];
  let musicHold = false; // true while showing an item that should pause the background music (Spotify)
  // The server's clock. Measured precisely (see syncClock); until then, roughly from the last check-in.
  const wall = () => performance.timeOrigin + performance.now(); // steady, unlike Date.now(), which can jump
  let clock = null; // { offset, rtt } once measured
  const serverMs = () => (clock ? wall() + clock.offset : Date.now() + serverOffset);
  const now = () => new Date(serverMs());
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let pendingLength = ''; // a video length we measured, to send with the next check-in
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /** Show the church logo (uploaded in Setup → Branding) in an <img>, or hide it if there isn't one. */
  function setLogo(img, url) {
    if (!url) { img.hidden = true; img.removeAttribute('src'); return; }
    if (img.getAttribute('src') !== url) { img.onerror = () => { img.hidden = true; }; img.src = url; }
    img.hidden = false;
  }

  /* ---------- First run: pick a screen ---------- */
  async function showPicker() {
    document.getElementById('picker').style.display = 'block';
    const list = document.getElementById('picker-list');
    try {
      const resp = await fetch('/api/player-list', { cache: 'no-store' });
      const screens = await resp.json();
      setLogo(document.getElementById('picker-logo'), resp.headers.get('X-Logo'));
      if (!screens.length) {
        list.innerHTML = '<p>No screens have been set up yet. Add one in the admin panel, then refresh this page.</p>';
        setTimeout(showPicker, 10000);
        return;
      }
      list.innerHTML = screens.map((s) => `<button data-id="${esc(s.id)}">${esc(s.name)}${s.location ? `<span>${esc(s.location)}</span>` : ''}</button>`).join('');
      list.querySelectorAll('button').forEach((b) => b.onclick = () => { store.set(b.dataset.id); location.replace('/player/' + encodeURIComponent(b.dataset.id)); });
      list.querySelector('button').focus();
    } catch {
      list.innerHTML = '<p>Can’t reach the signage server. Retrying…</p>';
      setTimeout(showPicker, 5000);
    }
  }

  if (!previewId && (params.has('pick') || !screenId)) {
    const saved = store.get();
    if (saved && !params.has('pick')) { location.replace('/player/' + encodeURIComponent(saved)); return; }
    showPicker();
    return;
  }
  if (screenId) store.set(screenId);
  document.body.classList.add('playing');

  /* ---------- Talking to the server ---------- */
  async function poll() {
    if (polling) { pollSoon = true; return; } // one at a time; run again straight after
    polling = true;
    clearTimeout(pollTimer);
    try {
      const url = previewId
        ? `/api/preview/${encodeURIComponent(previewId)}/state`
        : `/api/player/${encodeURIComponent(screenId)}/state?item=${encodeURIComponent(current ? current.name : '')}&res=${innerWidth}x${innerHeight}&music=${musicHold ? 1 : 0}${lastError ? '&err=' + encodeURIComponent(lastError) : ''}${playedKey ? '&played=' + encodeURIComponent(playedKey) : ''}${pendingLength ? '&len=' + encodeURIComponent(pendingLength) : ''}${synced ? `&sync=${Math.round(syncErr)}&rtt=${clock ? Math.round(clock.rtt) : ''}` : ''}`;
      const r = await fetch(url, { cache: 'no-store' });
      if (r.status === 404) {
        if (!previewId) { store.set(null); location.replace('/player?pick'); return; }
        showIdle('Playlist not found');
        return;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const s = await r.json();
      pendingLength = '';
      setOnline(true);
      if (boot && s.boot !== boot) { location.reload(); return; } // server restarted (maybe updated) → reload player
      boot = s.boot;
      serverOffset = s.serverNow - Date.now();
      applyRotation(s.screen.rotation);
      showIdentify(s.identify, s.screen.name);
      setLogo(document.getElementById('idle-logo'), s.logo);
      if (playedKey && s.onceKey !== playedKey) playedKey = ''; // the server has recorded it (or moved on anyway)
      if (s.hash !== hash && !(upcoming && upcoming.hash === s.hash)) {
        const prevCount = state && state.playlistId === s.playlistId && state.onceKey === s.onceKey ? state.items.length : 0; // a different playlist (or a new play-once showing) always starts fresh
        applyState(s, prevCount);
      }
      if (!previewId) setUpcoming(s.upcoming && s.upcoming.hash !== hash ? s.upcoming : null);
    } catch (e) {
      setOnline(false); // keep playing whatever we have
    } finally {
      polling = false;
      pollTimer = setTimeout(poll, pollSoon ? 0 : previewId ? 3000 : 5000);
      pollSoon = false;
    }
  }

  /* Tell the server straight away when background music should pause or come back (the 5s poll also renews it). */
  function setMusicHold(on, name) {
    if (previewId || on === musicHold) return;
    musicHold = on;
    fetch(`/api/player/${encodeURIComponent(screenId)}/music?hold=${on ? 1 : 0}&item=${encodeURIComponent(name || '')}`, { method: 'POST', cache: 'no-store' }).catch(() => {});
  }

  function setOnline(ok) { document.getElementById('status').style.display = ok ? 'none' : 'block'; }

  function applyRotation(deg) {
    stage.className = deg ? 'r' + deg : '';
  }

  function showIdentify(on, name) {
    const el = document.getElementById('identify');
    document.getElementById('identify-name').textContent = name;
    el.style.display = on ? 'flex' : 'none';
  }

  function showIdle(msg) {
    clearTimeout(timer);
    token++;
    current = null;
    setMusicHold(false);
    [...stage.children].forEach(retire);
    document.getElementById('idle-name').textContent = state && state.screen ? state.screen.name : '';
    document.getElementById('idle-msg').textContent = msg || 'Nothing scheduled';
    document.getElementById('idle').style.display = 'flex';
  }

  /* ---------- Playback ---------- */
  function startPlaylist(prevCount) {
    if (!state.items.length) { clearTimeout(timer); idx = -1; return showIdle(); }
    document.getElementById('idle').style.display = 'none';
    // Content changed (e.g. a file was dropped into a folder): if what's on screen is still in the
    // playlist, let it finish and carry on from there instead of jumping back to the start.
    if (current && prevCount > 1 && state.items.length > 1) {
      const k = state.items.findIndex((i) => i.key === current.key);
      if (k >= 0) { idx = k; return; }
    }
    clearTimeout(timer);
    idx = -1;
    current = null;
    next();
  }

  function next() {
    clearTimeout(timer);
    const items = state.items;
    if (!items.length) return showIdle();
    if (state.playOnce) {
      // Played through once: tell the server now, and keep the last item on screen until it sends what's next.
      if (idx >= items.length - 1) { if (playedKey !== state.onceKey) { playedKey = state.onceKey; poll(); } return; }
    } else if (items.length === 1 && current && current.key === items[0].key) return; // single item just stays (videos loop)
    idx = (idx + 1) % items.length;
    show(items[idx]);
  }

  function retire(layer) {
    layer.classList.remove('show');
    layer.querySelectorAll('video').forEach((v) => { try { v.pause(); v.removeAttribute('src'); v.load(); } catch {} });
    setTimeout(() => layer.remove(), 900);
  }

  function show(item) {
    const my = ++token;
    const single = state.items.length === 1 && !state.playOnce; // a lone item loops, unless it's to play once
    const layer = document.createElement('div');
    layer.className = 'layer' + (state.transition === 'none' ? ' cut' : '') + (item.fit === 'cover' ? ' cover' : '');
    let revealed = false;
    let el;

    const ready = () => {
      if (my !== token || revealed) return;
      revealed = true;
      clearTimeout(loadGuard);
      const old = [...stage.children].filter((c) => c !== layer);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        layer.classList.add('show');
        setTimeout(() => old.forEach(retire), state.transition === 'none' ? 0 : 850);
      }));
      current = item;
      lastError = '';
      setMusicHold(!!item.pauseMusic, item.name);
      if (item.type === 'video') {
        if (item.pauseMusic && !el.muted) {
          // Fade the video's sound in while the background music fades out.
          el.volume = 0;
          const t0 = performance.now();
          const ramp = () => { if (my !== token) return; const k = Math.min(1, (performance.now() - t0) / 1500); el.volume = k; if (k < 1) requestAnimationFrame(ramp); };
          requestAnimationFrame(ramp);
        }
        const p = el.play();
        if (p && p.catch) p.catch(() => { el.muted = true; el.play().catch(() => {}); });
      }
      if (single) return;
      if (item.type === 'video' && !item.duration) return; // advance on 'ended'
      timer = setTimeout(next, Math.max(1, item.duration || 10) * 1000);
    };

    const fail = (why) => {
      if (my !== token) return;
      lastError = `${item.name}: ${why}`;
      layer.remove();
      timer = setTimeout(next, state.items.length > 1 || state.playOnce ? 500 : 10000);
    };

    const loadGuard = setTimeout(() => { if (!revealed) (item.type === 'web' ? ready() : fail('took too long to load')); }, item.type === 'web' ? 5000 : 20000);

    switch (item.type) {
      case 'image':
        el = new Image();
        el.decoding = 'async';
        el.onload = ready;
        el.onerror = () => fail('image failed to load');
        el.src = item.url;
        break;
      case 'video':
        el = document.createElement('video');
        el.muted = !!item.muted;
        el.playsInline = true;
        el.setAttribute('playsinline', '');
        el.preload = 'auto';
        if (single) el.loop = true;
        el.addEventListener('canplay', ready, { once: true });
        el.addEventListener('loadedmetadata', () => noteLength(item, el), { once: true });
        el.onerror = () => fail('video failed to play (check the format is MP4/H.264 or WebM)');
        el.onended = () => { if (my === token) next(); };
        el.src = item.url;
        break;
      case 'web':
        el = document.createElement('iframe');
        el.allow = 'autoplay; fullscreen; encrypted-media';
        el.referrerPolicy = 'no-referrer-when-downgrade';
        el.onload = ready;
        el.src = item.url;
        break;
      case 'text':
      case 'countdown':
        el = slide(item);
        setTimeout(ready, 30);
        break;
      default:
        fail('unknown type');
        return;
    }
    layer.appendChild(el);
    stage.appendChild(layer);
  }

  /* ---------- Synced playback ----------
     When the server sends a timeline, every screen works out from the shared clock which item should be on
     screen and how far into it, loads the next item ahead of time and starts it on the exact moment, and
     keeps videos in step with gentle speed changes. Without a timeline, the engine above runs as before. */
  let synced = false, sTimer = null, sTimers = [], syncErr = 0;
  let shown = null; // { key, at (server ms the step began), layer, el, item, own }
  const prepared = new Map(); // `${key}@${at}` → { layer, el, item, ready }
  let upcoming = null, upTimers = [];
  const PREP_MS = 8000; // start loading the next item this long before it's due

  function noteLength(item, el) {
    if (item.type === 'video' && !item.length && isFinite(el.duration) && el.duration > 0.2) pendingLength = JSON.stringify([item.mediaId, el.duration, item.url]);
  }

  /** Which step of timeline tl is on screen at server time t. */
  function locate(tl, t) {
    let e = (t - tl.anchor) / 1000;
    if (e < 0) e = 0;
    let base = 0;
    if (tl.loop) { const n = Math.floor(e / tl.cycle); base = n * tl.cycle; e -= base; }
    else if (e >= tl.cycle) return { ended: true };
    let i = tl.steps.length - 1;
    for (let k = 0; k < tl.steps.length; k++) if (e < tl.steps[k].at + tl.steps[k].len) { i = k; break; }
    const st = tl.steps[i];
    return { i, step: st, at: tl.anchor + (base + st.at) * 1000 };
  }
  const itemFor = (s, key) => s.items.find((x) => x.key === key);

  function applyState(s, prevCount = 0) {
    hash = s.hash;
    const was = synced;
    state = s;
    if (s.timeline && !previewId) {
      if (!was) { clearTimeout(timer); token++; } // stop the other engine; what's on screen stays until replaced
      synced = true;
      document.getElementById('idle').style.display = 'none';
      syncPlan();
    } else {
      if (was) syncStop();
      startPlaylist(was ? 0 : prevCount);
    }
  }

  function syncStop() {
    synced = false;
    clearTimeout(sTimer);
    for (const p of prepared.values()) p.layer.remove();
    prepared.clear();
    shown = null;
    [...stage.children].forEach((c) => { c.style.zIndex = ''; });
  }

  /** Decide what should be on screen now, show it if it isn't, and plan the next change. */
  function syncPlan() {
    clearTimeout(sTimer);
    sTimers.forEach(clearTimeout); sTimers = [];
    if (!synced) return;
    const tl = state.timeline;
    const t = serverMs();
    const loc = locate(tl, t);
    if (loc.ended) { // a play-once showing has finished: tell the server, keep the last item up
      if (playedKey !== state.onceKey) { playedKey = state.onceKey; poll(); }
      return;
    }
    const item = itemFor(state, loc.step.key);
    if (!item) return;
    // Already on screen? (A lone image or slide simply stays up; a video starts again each time round.)
    const same = shown && shown.key === loc.step.key && (Math.abs(shown.at - loc.at) <= 1 || shown.item.type !== 'video');
    if (same) { shown.at = loc.at; shown.own = loc.step.own; } else syncShow(item, loc.step, loc.at);
    // The next change: the next step, unless an upcoming change comes first (that one prepares itself).
    const nextAt = loc.at + loc.step.len * 1000;
    if (upcoming && upcoming.at <= nextAt) return;
    if (!tl.loop && nextAt >= tl.anchor + tl.cycle * 1000) { sTimer = setTimeout(syncPlan, Math.max(0, nextAt - serverMs())); return; }
    const nl = locate(tl, nextAt + 1);
    const nItem = !nl.ended && itemFor(state, nl.step.key);
    if (nItem && !(nl.step.key === loc.step.key && nItem.type !== 'video')) {
      sTimers.push(setTimeout(() => syncPrepare(nItem, nl.step, nl.at), Math.max(0, nextAt - PREP_MS - serverMs())));
    }
    sTimer = setTimeout(syncPlan, Math.max(0, nextAt - serverMs()));
  }

  /** Load an item ahead of time, hidden, ready to start at server time `at`. */
  function syncPrepare(item, step, at) {
    const id = `${step.key}@${at}`;
    if (prepared.has(id) || at < serverMs() - 1000) return prepared.get(id);
    const layer = document.createElement('div');
    layer.className = 'layer' + (item.fit === 'cover' ? ' cover' : '');
    const p = { layer, item, ready: false, el: null };
    const done = () => { p.ready = true; };
    let el;
    switch (item.type) {
      case 'image': el = new Image(); el.decoding = 'async'; el.onload = done; el.onerror = () => { lastError = `${item.name}: image failed to load`; }; el.src = item.url; break;
      case 'video':
        el = document.createElement('video');
        el.muted = !!item.muted; el.playsInline = true; el.setAttribute('playsinline', ''); el.preload = 'auto';
        el.addEventListener('loadeddata', done, { once: true });
        el.addEventListener('loadedmetadata', () => noteLength(item, el), { once: true });
        el.onerror = () => { lastError = `${item.name}: video failed to play (check the format is MP4/H.264 or WebM)`; };
        el.src = item.url;
        break;
      case 'web': el = document.createElement('iframe'); el.allow = 'autoplay; fullscreen; encrypted-media'; el.referrerPolicy = 'no-referrer-when-downgrade'; el.onload = done; el.src = item.url; setTimeout(done, 5000); break;
      case 'text': case 'countdown': el = slide(item); done(); break;
      default: return null;
    }
    p.el = el;
    layer.appendChild(el);
    stage.insertBefore(layer, stage.firstChild); // underneath, invisible, until it's due
    prepared.set(id, p);
    // Forget preparations that were never used (e.g. the playlist changed meanwhile).
    for (const [k, q] of prepared) if (+k.split('@').pop() < serverMs() - 60000) { q.layer.remove(); prepared.delete(k); }
    return p;
  }

  /** Put an item on screen for the step that began at server time `at` (joining part-way if it's late). */
  function syncShow(item, step, at) {
    const my = ++token;
    const id = `${step.key}@${at}`;
    const p = prepared.get(id) || syncPrepare(item, step, at);
    if (!p) return;
    prepared.delete(id);
    const reveal = () => {
      if (my !== token || !synced) return;
      const { layer, el } = p;
      const sameAgain = shown && shown.key === step.key; // the same item again (a lone video looping): cut, don't fade
      layer.classList.toggle('cut', state.transition === 'none' || !!sameAgain);
      // Bring it to the front by stacking order, not by moving it (moving would reload a web page).
      const old = [...stage.children].filter((c) => c !== layer && !isPrepared(c));
      old.forEach((c) => { c.style.zIndex = '1'; });
      layer.style.zIndex = '2';
      const late = (serverMs() - at) / 1000;
      if (item.type === 'video') {
        if (late > 0.25) el.currentTime = Math.min(late + 0.05, Math.max(0, (el.duration || late) - 0.1));
        if (item.pauseMusic && !el.muted) {
          el.volume = 0;
          const t0 = performance.now();
          const ramp = () => { if (my !== token) return; const k = Math.min(1, (performance.now() - t0) / 1500); el.volume = k; if (k < 1) requestAnimationFrame(ramp); };
          requestAnimationFrame(ramp);
        }
        const pr = el.play();
        if (pr && pr.catch) pr.catch(() => { el.muted = true; el.play().catch(() => {}); });
      }
      syncErr = item.type === 'video' ? 0 : Math.max(0, late * 1000);
      requestAnimationFrame(() => {
        layer.classList.add('show');
        setTimeout(() => old.forEach(retire), layer.classList.contains('cut') ? 0 : 850);
      });
      shown = { key: step.key, at, layer, el, item, own: step.own };
      current = item;
      lastError = '';
      setMusicHold(!!item.pauseMusic, item.name);
    };
    if (p.ready) reveal();
    else {
      // Not loaded yet (a slow network, or this screen just joined): show it the moment it is, at the right point.
      const iv = setInterval(() => { if (my !== token || !synced) return clearInterval(iv); if (p.ready) { clearInterval(iv); reveal(); } }, 30);
      setTimeout(() => { clearInterval(iv); if (!p.ready && my === token) { lastError = lastError || `${item.name}: took too long to load`; p.layer.remove(); } }, 20000);
    }
  }
  const isPrepared = (layer) => { for (const p of prepared.values()) if (p.layer === layer) return true; return false; };

  // Keep the video on screen in step with the timeline: nudge its speed slightly, or jump if it's far out.
  setInterval(() => {
    if (!synced || !shown || shown.item.type !== 'video' || !shown.el) return;
    const v = shown.el;
    const expected = (serverMs() - shown.at) / 1000;
    if (expected >= shown.own - 0.05) { // past its own length: hold the last frame until the step ends
      v.playbackRate = 1;
      if (!v.paused && expected >= shown.own && v.duration > shown.own + 0.1) v.pause();
      return;
    }
    if (v.paused || v.readyState < 3 || v.seeking) return;
    const diff = v.currentTime - expected; // positive: ahead
    syncErr = diff * 1000;
    if (Math.abs(diff) > 1) { v.currentTime = expected + 0.1; v.playbackRate = 1; }
    else if (Math.abs(diff) > 0.03) { try { v.playbackRate = 1 - Math.max(-0.04, Math.min(0.04, diff * 0.6)); } catch {} }
    else if (v.playbackRate !== 1) v.playbackRate = 1;
  }, 250);

  /** A change due in a few seconds (a schedule starting, a takeover): load it now, switch on the moment. */
  function setUpcoming(up) {
    if ((up && up.hash) === (upcoming && upcoming.hash)) return;
    upTimers.forEach(clearTimeout); upTimers = [];
    upcoming = up;
    if (!up) return synced && syncPlan();
    const lead = up.at - serverMs();
    if (up.timeline) {
      const loc = locate(up.timeline, up.at + 1);
      const it = !loc.ended && itemFor(up, loc.step.key);
      if (it) upTimers.push(setTimeout(() => syncPrepare(it, loc.step, loc.at), Math.max(0, lead - PREP_MS)));
    }
    upTimers.push(setTimeout(() => { if (upcoming === up) { upcoming = null; applyState(up, 0); } }, Math.max(0, lead)));
  }

  /** Line our clock up with the server's: several quick round trips, keeping the quickest (the most exact). */
  async function syncClock(samples) {
    let best = null;
    for (let i = 0; i < samples; i++) {
      try {
        const t0 = wall();
        const j = await (await fetch('/api/time', { cache: 'no-store' })).json();
        const t1 = wall();
        if (!best || t1 - t0 < best.rtt) best = { rtt: t1 - t0, offset: j.now - (t0 + t1) / 2 };
      } catch {}
      await sleep(40);
    }
    if (!best) return;
    // Small corrections are eased in, so videos aren't nudged back and forth by measurement noise.
    if (clock && Math.abs(best.offset - clock.offset) < 40) best.offset = clock.offset + (best.offset - clock.offset) * 0.5;
    clock = best;
  }

  function slide(item) {
    const d = document.createElement('div');
    d.className = 'slide' + (item.align === 'left' ? ' left' : '') + (item.bgImage ? ' has-img' : '');
    d.style.background = item.bg;
    d.style.color = item.fg;
    if (item.bgImage) { d.style.backgroundImage = `url("${item.bgImage}")`; d.style.backgroundSize = 'cover'; d.style.backgroundPosition = 'center'; }
    if (item.type === 'text') {
      d.innerHTML = `<div class="slide-inner">${item.title ? `<h1>${esc(item.title)}</h1>` : ''}${item.body ? `<p>${esc(item.body)}</p>` : ''}</div>`;
    } else {
      d.innerHTML = `<div class="slide-inner">${item.title ? `<h1>${esc(item.title)}</h1>` : ''}<div class="count"></div>${item.body ? `<p>${esc(item.body)}</p>` : ''}</div>`;
      const c = d.querySelector('.count');
      const tick = () => {
        if (!d.isConnected && d._started) return clearInterval(iv);
        d._started = true;
        const n = now();
        const [h, m] = (item.target || '10:00').split(':').map(Number);
        const t = new Date(n); t.setHours(h, m, 0, 0);
        const secs = Math.ceil((t - n) / 1000);
        if (secs > 0) {
          const hh = Math.floor(secs / 3600), mm = Math.floor((secs % 3600) / 60), ss = secs % 60;
          c.textContent = (hh ? hh + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0');
          c.classList.remove('small');
        } else {
          c.textContent = item.after || '';
          c.classList.add('small');
        }
      };
      tick();
      const iv = setInterval(tick, 250);
    }
    return d;
  }

  /* ---------- Keep the screen awake ---------- */
  async function wake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  wake();

  // Safety net: a full reload once a day at ~3am clears any browser memory build-up.
  setInterval(() => { const n = new Date(); if (n.getHours() === 3 && n.getMinutes() === 0 && performance.now() > 3600000) location.reload(); }, 30000);

  // Hear about changes the moment they happen (TVs whose browsers can't do this still check every 5 s).
  if (!previewId && window.EventSource) { try { new EventSource(`/api/player/${encodeURIComponent(screenId)}/events`).onmessage = () => poll(); } catch {} }
  (previewId ? Promise.resolve() : syncClock(6)).then(poll);
  if (!previewId) setInterval(() => syncClock(3), 60000);
})();
</script>
</body>
</html>
